name: Playwright E2E

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Playwright repo
        uses: actions/checkout@v4

      - name: Checkout front
        uses: actions/checkout@v4
        with:
          repository: flaviobarbosac/prosiffionaisliberais-front
          path: prosiffionaisliberais-front
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install front dependencies
        working-directory: prosiffionaisliberais-front
        run: npm ci

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CLAMPFY_FRONT_DIR: ${{ github.workspace }}/prosiffionaisliberais-front
          VITE_API_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://api.clampfy.com/api/v1' || 'https://api.dev.clampfy.com/api/v1' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ADMIN_ENABLED: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
          VITE_ADMIN_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          VITE_ADS_ENABLED: "false"
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
